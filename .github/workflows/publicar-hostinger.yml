# Publicação do site na Hostinger
# A cada alteração na branch main (inclusive as feitas pelo painel), o GitHub
# gera o site (npm run build) e grava o resultado na branch "hostinger".
# A Hostinger (Implantação a partir do Git) lê essa branch e atualiza o site.
name: Publicar para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-hostinger
  cancel-in-progress: true

jobs:
  build-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o sitemap usa a data do último commit de cada página

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Capas de compartilhamento dos artigos do blog: só instala o navegador
      # (Playwright) quando há artigo novo ou alterado sem capa.
      - name: Capas de compartilhamento do blog
        run: |
          if node scripts/gen-og-blog.mjs --check | grep -vq " 0 capa"; then
            npm i --no-save playwright
            npx playwright install --with-deps chromium
            node scripts/gen-og-blog.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/og/blog
            git commit -q -m "Capas de compartilhamento do blog (geradas automaticamente) [skip ci]" || true
            git push -q origin HEAD:main || echo "não foi possível gravar as capas na main (seguindo com o build)"
          fi

      - name: Gerar o site
        run: npm run build

      - name: Gravar o resultado na branch hostinger
        run: |
          cd dist
          test -f index.html || { echo "dist sem index.html"; exit 1; }
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site gerado de ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin hostinger
