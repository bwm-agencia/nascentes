name: Ranking IA — Brotas

on:
  schedule:
    - cron: "17 9 1 * *"   # dia 1º de cada mês, 06:17 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ranking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ranking-brotas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar respostas das IAs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python3 scripts/coletar.py
      - name: Gerar ranking e página
        run: python3 scripts/gerar.py
      - name: Publicar
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet || git commit -m "Ranking IA Brotas: $(date +%Y-%m)"
          git push
