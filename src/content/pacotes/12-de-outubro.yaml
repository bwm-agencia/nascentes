faq:
- pergunta: Qual é o valor do pacote?
  resposta: As tarifas variam conforme a suíte e o número de pessoas. Chame a gente no WhatsApp para receber o valor atualizado, que está sujeito a alterações sem aviso prévio.
- pergunta: Quantas diárias são?
  resposta: O pacote é de três diárias, de 09 a 12 de outubro.
- pergunta: Dá para vir com mais pessoas?
  resposta: Dá. Temos suítes temáticas duplas, triplas e quádruplas, com hidromassagem ou ofurô. Consulte a disponibilidade.
- pergunta: Qual a diferença entre hidromassagem e ofurô?
  resposta: São 14 suítes com banheira de hidromassagem para o casal e 4 suítes com ofurô cromoterápico individual. As duas opções estão incluídas no pacote, é só escolher o clima que combina mais com vocês.
- pergunta: A massagem está incluída?
  resposta: Não, mas a pousada tem sala de massagem, a partir de R$ 120 por pessoa. É só pedir na reserva.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
