faq:
- pergunta: Como recebo o desconto?
  resposta: Faça a reserva pelo WhatsApp, telefone ou e-mail e informe seus dados de nascimento no momento da reserva. A equipe aplica o desconto na hora.
- pergunta: Quem tem direito?
  resposta: O desconto vale somente para o aniversariante, em reservas feitas para o mês do aniversário, e não se estende aos demais hóspedes.
- pergunta: Quanto fica o pacote?
  resposta: Para um casal na suíte com hidromassagem, 2 diárias com café da manhã saem de R$ 1.380,00 por R$ 1.207,50. O desconto vale na parte do aniversariante.
- pergunta: Vale para qualquer suíte?
  resposta: A promoção vale para as 14 suítes temáticas com banheira de hidromassagem.
- pergunta: Vale em feriados?
  resposta: Não. A promoção não é válida em feriados prolongados, que têm pacotes próprios.
- pergunta: Quais as formas de pagamento?
  resposta: 'Duas opções: 50% no ato da reserva como sinal e o restante no check-out, podendo ser parcelado no cartão de crédito; ou 4x no cartão de crédito no ato da reserva, por link de pagamento.'
- pergunta: Há taxas adicionais?
  resposta: Sim. É cobrada taxa de serviço/turismo de 3%, no check-out. Os valores estão sujeitos a alteração sem aviso prévio.
- pergunta: Qual o horário de check-in e check-out?
  resposta: Check-in a partir das 14h e check-out até as 14h.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
