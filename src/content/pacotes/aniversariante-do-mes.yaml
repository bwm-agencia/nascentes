faq:
- pergunta: Como recebo o desconto?
  resposta: Faça a reserva pelo WhatsApp, telefone ou e-mail e informe sua data de nascimento. A equipe aplica o desconto na hora.
- pergunta: Quem tem direito?
  resposta: O desconto vale somente para o aniversariante, em reservas feitas para o mês do aniversário, e não se estende aos demais hóspedes.
- pergunta: Vale para qualquer suíte?
  resposta: A promoção vale para as 14 suítes temáticas com banheira de hidromassagem.
- pergunta: Quantas diárias preciso reservar?
  resposta: O desconto vale para pacotes acima de duas diárias. Exceto feriados.
- pergunta: Vale em feriados?
  resposta: Não. A promoção não é válida em feriados, que têm pacotes próprios.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
