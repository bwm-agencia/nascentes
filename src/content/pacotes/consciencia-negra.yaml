faq:
- pergunta: Qual é o valor do pacote?
  resposta: 'Duplo com hidro: R$ 1.380 (2 diárias) ou R$ 1.880 (3). Duplo com ofurô: R$ 1.060 ou R$ 1.560. Triplo com hidro: R$ 1.680 ou R$ 2.365. Quádruplo com hidro: R$ 1.990 ou R$ 2.785. Todos com café da manhã e taxa de serviço/turismo de 3% sobre as diárias.'
- pergunta: Quais são as datas?
  resposta: O pacote vai de quinta, 19/11, a domingo, 22/11, com check-in a partir das 14h e check-out até as 14h.
- pergunta: Dá para vir com mais pessoas?
  resposta: Dá. Temos suítes temáticas duplas, triplas e quádruplas, com hidromassagem ou ofurô. Consulte a disponibilidade.
- pergunta: Qual a diferença entre hidromassagem e ofurô?
  resposta: São 14 aptos com hidromassagem, que acomoda 2 pessoas na banheira, e 4 aptos com ofurô e jato de hidro, para 1 pessoa por vez. As duas opções estão incluídas no pacote.
- pergunta: Quais as formas de pagamento?
  resposta: 50% do total da reserva como sinal em Pix e o restante em até 3x no cartão no check-in. Ou em 5x no ato da reserva, no cartão, por link de pagamento.
- pergunta: E se eu precisar cancelar ou sair antes?
  resposta: Em caso de desistência ou cancelamento, o sinal da reserva não será reembolsado nem transferido para outro período. Em caso de saída antecipada, será cobrado o valor total do período.
- pergunta: A massagem está incluída?
  resposta: Não, mas a pousada tem sala de massagem, a partir de R$ 120 por pessoa. É só pedir na reserva.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
