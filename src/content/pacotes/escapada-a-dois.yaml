faq:
- pergunta: O valor de R$ 1.380 é por pessoa?
  resposta: Não. É o valor total para o casal, com as duas diárias, o café da manhã nas duas manhãs, as duas massagens, o mimo e o late check-out inclusos.
- pergunta: A massagem é para os dois mesmo?
  resposta: Sim. É uma massagem para cada um, na sala de massagem da pousada. O horário é combinado com vocês durante a estadia.
- pergunta: Posso escolher a suíte?
  resposta: Pode. Conta pra gente qual chamou mais atenção no momento da reserva. Sempre que a data permite, a gente separa a de vocês.
- pergunta: Qual a diferença entre hidromassagem e ofurô?
  resposta: São 14 suítes com banheira de hidromassagem para o casal e 4 suítes com ofurô cromoterápico individual. As duas opções estão incluídas no pacote, é só escolher o clima que combina mais com vocês.
- pergunta: O check-out é mesmo às 17h?
  resposta: É. O late check-out está incluído, sem custo adicional. Vocês têm a tarde inteira do último dia.
- pergunta: Para quais datas o pacote é válido?
  resposta: As datas disponíveis são confirmadas na hora pelo WhatsApp. Feriados e datas especiais têm pacotes próprios.
- pergunta: Dá para ficar mais noites?
  resposta: Dá. Chame a gente no WhatsApp e montamos a estadia com as datas de vocês.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
