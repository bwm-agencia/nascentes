faq:
- pergunta: Quais as datas do pacote de Natal?
  resposta: De 23 a 27/12/2026. Vocês escolhem o período dentro dessas datas, com mínimo de 2 diárias, sujeito à disponibilidade.
- pergunta: Como funciona a 5ª diária de cortesia?
  resposta: Quem ficar 4 diárias ganha a 5ª como cortesia. Consulte pelo WhatsApp a disponibilidade para o período desejado.
- pergunta: O chopp e o happy hour valem para quem?
  resposta: Para os hóspedes que estiverem hospedados na noite de 24/12. A pousada oferece 50 litros de chopp na piscina e um happy hour de confraternização com coquetel e petiscos no entorno da piscina.
- pergunta: O café da manhã está incluso?
  resposta: Sim, em todos os dias da hospedagem.
- pergunta: Os valores são por pessoa?
  resposta: Não. São valores por suíte (dupla, tripla ou quádrupla), pelo total de diárias escolhido.
- pergunta: Quais as formas de pagamento?
  resposta: Em até 5x no ato da reserva, com link de pagamento. Sobre o valor das diárias é cobrado 3% de taxa de serviço e turismo.
- pergunta: Qual o horário de check-in e check-out?
  resposta: Check-in a partir das 14h e check-out até as 14h.
- pergunta: Qual a diferença entre hidromassagem e ofurô?
  resposta: Há suítes com banheira de hidromassagem e suítes com ofurô cromoterápico individual. Todas são temáticas, é só escolher o clima que combina mais com vocês.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
