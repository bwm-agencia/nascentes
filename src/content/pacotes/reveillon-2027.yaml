faq:
- pergunta: Quais as datas do pacote de Réveillon?
  resposta: De 30/12/2026 (quarta) a 03/01/2027 (domingo). Vocês escolhem os dias a partir de 30/12, sujeito à disponibilidade.
- pergunta: Como funciona a 5ª diária de cortesia?
  resposta: Quem ficar 4 diárias ganha a 5ª como cortesia, prolongando a confraternização. Consulte pelo WhatsApp a disponibilidade para o período desejado.
- pergunta: A ceia está inclusa?
  resposta: Sim. A ceia da noite de 31/12 está incluída nas diárias, com entradas, pratos e sobremesas (tortas e pavês).
- pergunta: O que mais o pacote oferece na virada?
  resposta: A pousada oferece 50 litros de chopp artesanal na piscina no dia 31/12 e um Prosecco por apartamento.
- pergunta: O café da manhã está incluso?
  resposta: Sim, todos os dias da hospedagem.
- pergunta: Os valores são por pessoa?
  resposta: Não. São valores por suíte (dupla, tripla ou quádrupla), pelo total de diárias escolhido.
- pergunta: Quais as formas de pagamento?
  resposta: Em até 5x no ato da reserva, com link de pagamento.
- pergunta: Qual o horário de check-in e check-out?
  resposta: Check-in a partir das 14h e check-out até as 14h.
- pergunta: E se eu precisar cancelar ou sair antes?
  resposta: Em caso de desistência ou cancelamento, o sinal da reserva não será reembolsado nem transferido para outro período. Em caso de saída antecipada, será cobrado o valor total do período.
- pergunta: Posso levar meu pet?
  resposta: A pousada é pet friendly para animais de pequeno porte. Avise na reserva para prepararmos tudo.
- pergunta: Como garanto a reserva?
  resposta: Todo o processo é feito pelo WhatsApp, direto com a nossa equipe. Vocês escolhem as datas e a gente confirma a disponibilidade na hora.
